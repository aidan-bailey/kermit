[workspace]
resolver = "2"
members = [
    "kermit",
    "kermit-algos",
    "kermit-bench",
    "kermit-ds",
    "kermit-iters",
    "kermit-derive",
    "kermit-parser",
    "kermit-rdf",
]

[workspace.package]
authors = ["Aidan Bailey"]
edition = "2021"
homepage = "https://github.com/aidan-bailey/kermit"
license = "Apache-2.0 OR MIT"
# Not published to crates.io: releases are GitHub tags plus a git-cliff
# changelog (`.github/workflows/release.yml`).
publish = false
readme = "README.md"
repository = "https://github.com/aidan-bailey/kermit"

[patch.crates-io]
kermit = { path = "kermit" }
kermit-ds = { path = "kermit-ds" }
kermit-iters = { path = "kermit-iters" }
kermit-algos = { path = "kermit-algos" }
kermit-derive = { path = "kermit-derive" }
kermit-bench = { path = "kermit-bench" }
kermit-parser = { path = "kermit-parser" }
kermit-rdf = { path = "kermit-rdf" }

# jemalloc (the `kermit` binary's allocator, #112) runs its configure probes with
# -Werror. Where the C compiler defines _FORTIFY_SOURCE by default (nix's gcc
# wrapper does), glibc warns that it needs optimisation, so at the dev profile's
# -O0 every probe fails ("cannot determine return type of strerror_r"). Build it
# optimised in every profile; release already is.
[profile.dev.package.tikv-jemalloc-sys]
opt-level = 3
