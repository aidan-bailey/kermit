name: Engines

# The external engines' feature-gated checks, on every pull request into master and every push to
# it, so that engine code landed by a direct push is checked as well. A workflow of its own, so
# that Release (which follows CI) does not wait on its long cold build.
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  # A pull request's newer run cancels its older one; every master commit keeps its own run.
  group: engines-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_BACKTRACE: 1

jobs:
  engines:
    name: Engines (DuckDB bundled, Nemo)
    runs-on: ubuntu-latest
    # CI has no Nix, so `engine-duckdb-bundled` compiles DuckDB's amalgamation, one large C++
    # translation unit: expect a long cold build.
    timeout-minutes: 60
    env:
      RUSTFLAGS: -Dwarnings
      RUSTDOCFLAGS: -Dwarnings
      # The one place the job names its engines.
      ENGINE_FEATURES: engine-duckdb-bundled,engine-nemo
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: nightly
          components: clippy
      - uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db # v2
      - run: cargo clippy -p kermit --all-targets --features "$ENGINE_FEATURES"
      - run: cargo doc -p kermit --no-deps --features "$ENGINE_FEATURES"
      - run: cargo test -p kermit --features "$ENGINE_FEATURES" --lib
      - run: cargo test -p kermit --features "$ENGINE_FEATURES" --test engine_oracle
      - run: cargo test -p kermit --features "$ENGINE_FEATURES" --bin kermit
      - run: cargo test -p kermit --features "$ENGINE_FEATURES" --test cli_engines
